<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR Menu</title>

<style>
body {
  font-family: Arial;
  margin: 0;
  background: #f2f2f2;
}

header {
  background: black;
  color: white;
  text-align: center;
  padding: 20px;
  font-size: 22px;
}

.container {
  padding: 15px;
}

.menu-item {
  background: white;
  padding: 15px;
  margin-bottom: 10px;
  border-radius: 10px;
}

button {
  width: 100%;
  padding: 14px;
  font-size: 18px;
  background: green;
  color: white;
  border: none;
  border-radius: 8px;
  margin-top: 10px;
}

.order-box {
  background: white;
  padding: 15px;
  margin-top: 20px;
  border-radius: 10px;
}
</style>

</head>
<body>

<header>🍽️ Easy QR Menu</header>

<div class="container">

<h3 id="tableText"></h3>

<div class="menu-item">
  <h3>🍕 Pizza - ₹199</h3>
  <button onclick="addItem('Pizza ₹199')">Add</button>
</div>

<div class="menu-item">
  <h3>🍔 Burger - ₹99</h3>
  <button onclick="addItem('Burger ₹99')">Add</button>
</div>

<div class="menu-item">
  <h3>🍝 Pasta - ₹149</h3>
  <button onclick="addItem('Pasta ₹149')">Add</button>
</div>

<div class="order-box">
  <h3>Your Order</h3>
  <ul id="list"></ul>
  <button onclick="sendOrder()">Send Order on WhatsApp</button>
</div>

</div>

<script>
let items = [];

// 👇 Auto Table Detect
let params = new URLSearchParams(window.location.search);
let table = params.get("table");

// Show table on screen
if(table){
  document.getElementById("tableText").innerText = "Table: " + table;
}

function addItem(item) {
  items.push(item);
  showItems();
}

function showItems() {
  let list = document.getElementById("list");
  list.innerHTML = "";
  items.forEach(i => {
    let li = document.createElement("li");
    li.innerText = i;
    list.appendChild(li);
  });
}

function sendOrder() {
  let number = "919203173272";

  if(items.length === 0){
    alert("Please add items");
    return;
  }

  let msg = "🛒 Order:%0A";
  items.forEach(i => msg += "- " + i + "%0A");

  msg += "%0ATable: " + (table ? table : "Not Set");

  let url = "https://wa.me/" + number + "?text=" + msg;
  window.open(url, '_blank');
}
</script>

</body>
</html>
