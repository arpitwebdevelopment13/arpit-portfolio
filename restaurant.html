<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Restaurant | Online Order</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #fff8f0;
        }
        header {
            background: white;
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 100;
        }
        .logo {
            font-size: 22px;
            font-weight: bold;
            color: #ff4500;
        }
        nav a {
            text-decoration: none;
            color: #333;
            margin-left: 15px;
            font-weight: 500;
        }
        .hero {
            height: 100vh;
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?w=1200');
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: white;
            padding-top: 60px;
        }
        .hero h1 {
            font-size: 36px;
            margin-bottom: 15px;
        }
        .hero p {
            font-size: 18px;
            margin-bottom: 25px;
        }
        .btn {
            padding: 12px 30px;
            background: #ff4500;
            color: white;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
        }
        .menu-section {
            padding: 70px 5%;
        }
        .menu-section h2 {
            text-align: center;
            font-size: 28px;
            margin-bottom: 30px;
            color: #333;
        }
        .menu-section h2 span {
            color: #ff4500;
        }
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }
        .menu-item {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: 0.3s;
        }
        .menu-item:hover {
            transform: scale(1.03);
        }
        .menu-item.selected {
            border: 3px solid #ff4500;
        }
        .menu-item.selected::after {
            content: '✓ Added';
            position: absolute;
            top: 10px;
            right: 10px;
            background: #ff4500;
            color: white;
            padding: 3px 10px;
            border-radius: 15px;
            font-size: 12px;
        }
        .menu-item img {
            width: 100%;
            height: 150px;
            object-fit: cover;
        }
        .menu-info {
            padding: 12px;
            text-align: center;
        }
        .menu-info h3 {
            font-size: 16px;
            color: #333;
        }
        .menu-info p {
            font-size: 13px;
            color: #666;
            margin: 5px 0;
        }
        .menu-info .price {
            font-size: 18px;
            color: #ff4500;
            font-weight: bold;
        }
        .order-section {
            background: white;
            padding: 40px 5%;
            margin: 30px 5%;
            border-radius: 15px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.1);
        }
        .order-section h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #333;
        }
        .order-list {
            min-height: 80px;
            border: 2px dashed #ddd;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
        }
        .order-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
        }
        .total {
            text-align: right;
            font-size: 22px;
            font-weight: bold;
            color: #333;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            color: #333;
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
        }
        .order-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(45deg, #25d366, #128c7e);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }
        .order-btn:disabled {
            background: #ccc;
        }
        .cart-badge {
            position: fixed;
            top: 70px;
            right: 15px;
            background: #ff4500;
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 14px;
            display: none;
            z-index: 101;
        }
        .float-btn {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
            position: fixed;
            bottom: 20px;
            right: 20px;
            text-decoration: none;
            box-shadow: 0 3px 10px rgba(0,0,0,0.3);
            z-index: 999;
        }
        .whatsapp-btn {
            background: #25d366;
            bottom: 85px;
        }
        .call-btn {
            background: #ff4500;
        }
        footer {
            background: #333;
            color: white;
            text-align: center;
            padding: 25px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">My Restaurant</div>
        <nav>
            <a href="#menu">Menu</a>
            <a href="#order">Order</a>
        </nav>
    </header>

    <div class="cart-badge" id="cartBadge">
        <span id="count">0</span> Items Selected
    </div>

    <section class="hero">
        <div>
            <h1>Order Online</h1>
            <p>Click on food items to add to order</p>
            <a href="#menu" class="btn">View Menu</a>
        </div>
    </section>

    <section class="menu-section" id="menu">
        <h2>Our <span>Menu</span> (15 Items)</h2>
        <div class="menu-grid" id="menuGrid"></div>
    </section>

    <section class="order-section" id="order">
        <h2>Your Order</h2>
        <div class="order-list" id="orderList">
            <p style="color:#999; text-align:center;">No items selected yet</p>
        </div>
        <div class="total">Total: Rs. <span id="totalAmount">0</span></div>
        
        <div class="form-group">
            <label>Your Name *</label>
            <input type="text" id="name" placeholder="Enter your name" required>
        </div>
        <div class="form-group">
            <label>Phone Number *</label>
            <input type="tel" id="phone" placeholder="Enter phone number" required>
        </div>
        <div class="form-group">
            <label>Delivery Address *</label>
            <textarea id="address" placeholder="Enter your address" required></textarea>
        </div>
        
        <button class="order-btn" id="orderBtn" onclick="placeOrder()" disabled>Order via WhatsApp</button>
    </section>

    <footer>
        <p>Call: +91 9203173272</p>
        <p>&copy; 2023 My Restaurant</p>
    </footer>

    <a href="https://wa.me/9203173272" class="float-btn whatsapp-btn" target="_blank">
        <i class="fab fa-whatsapp"></i>
    </a>
    <a href="tel:9203173272" class="float-btn call-btn">
        <i class="fas fa-phone"></i>
    </a>

    <script>
        // 15 Food Items
        var foods = [
            {id:1, name:"Special Burger", desc:"Juicy patty with cheese", price:250, img:"https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=400"},
            {id:2, name:"Veggie Pizza", desc:"Fresh vegetables & cheese", price:499, img:"https://images.unsplash.com/photo-1586190848861-99c8a3da799c?w=400"},
            {id:3, name:"Chicken Biryani", desc:" aromatic basmati rice", price:350, img:"https://images.unsplash.com/photo-1601050690597-df0568f70950?w=400"},
            {id:4, name:"Cold Drinks", desc:"Refreshing Beverages", price:80, img:"https://images.unsplash.com/photo-1551024709-8f23befc6f87?w=400"},
            {id:5, name:"Grilled Chicken", desc:"Tandoori style chicken", price:450, img:"https://images.unsplash.com/photo-1532550907401-a500c9a6fb75?w=400"},
            {id:6, name:"Paneer Tikka", desc:"Cottage cheese grilled", price:320, img:"https://images.unsplash.com/photo-1565557623262-b51c2513a641?w=400"},
            {id:7, name:"Dal Makhani", desc:"Black lentils curry", price:250, img:"https://images.unsplash.com/photo-1546833999-b9f581a1996d?w=400"},
            {id:8, name:"Butter Chicken", desc:"Creamy tomato curry", price:400, img:"https://images.unsplash.com/photo-1603894584373-5ac82b2ae398?w=400"},
            {id:9, name:"Fried Rice", desc:"Vegetable fried rice", price:200, img:"https://images.unsplash.com/photo-1603133872878-684f208fb84b?w=400"},
            {id:10, name:"Chowmein", desc:"Vegetable noodles", price:180, img:"https://images.unsplash.com/photo-1569718212165-3a8278d5f624?w=400"},
            {id:11, name:"Samosa", desc:"Crispy snacks (4 pcs)", price:60, img:"https://images.unsplash.com/photo-1601050690597-df0568f70950?w=400"},
            {id:12, name:"Paav Bhaji", desc:"Spicy mashed vegetables", price:150, img:"https://images.unsplash.com/photo-1626132647523-66f5bf380027?w=400"},
            {id:13, name:"Dosa", desc:"Crispy rice pancake", price:120, img:"https://images.unsplash.com/photo-1668236543090-82eba5ee5976?w=400"},
            {id:14, name:"Idli Sambar", desc:"Steamed rice cakes", price:100, img:"https://images.unsplash.com/photo-1668236543090-82eba5ee5976?w=400"},
            {id:15, name:"Paratha", desc:"Flaky bread with curd", price:80, img:"https://images.unsplash.com/photo-1601050690117-9d0d06c7b5ae?w=400"}
        ];

        var selectedItems = [];
        var menuGrid = document.getElementById("menuGrid");

        // Display menu items
        foods.forEach(function(food) {
            var div = document.createElement("div");
            div.className = "menu-item";
            div.id = "food-" + food.id;
            div.onclick = function() { addToOrder(food.id); };
            div.innerHTML = '<img src="' + food.img + '" alt="' + food.name + '"><div class="menu-info"><h3>' + food.name + '</h3><p>' + food.desc + '</p><div class="price">Rs. ' + food.price + '</div></div>';
            menuGrid.appendChild(div);
        });

        function addToOrder(id) {
            var food = foods.find(f => f.id === id);
            var existing = selectedItems.find(f => f.id === id);
            
            if (existing) {
                existing.qty++;
            } else {
                selectedItems.push({id: food.id, name: food.name, price: food.price, qty: 1});
            }
            
            document.getElementById("food-" + id).classList.add("selected");
            updateOrderList();
        }

        function updateOrderList() {
            var orderList = document.getElementById("orderList");
            var total = 0;
            
            if (selectedItems.length === 0) {
                orderList.innerHTML = '<p style="color:#999; text-align:center;">No items selected yet</p>';
            } else {
                orderList.innerHTML = "";
                selectedItems.forEach(function(item) {
                    var div = document.createElement("div");
                    div.className = "order-item";
                    div.innerHTML = '<span>' + item.name + ' x ' + item.qty + '</span><span>Rs. ' + (item.price * item.qty) + '</span>';
                    orderList.appendChild(div);
                    total += item.price * item.qty;
                });
            }
            
            document.getElementById("totalAmount").innerText = total;
            document.getElementById("count").innerText = selectedItems.length;
            document.getElementById("cartBadge").style.display = selectedItems.length > 0 ? "block" : "none";
            document.getElementById("orderBtn").disabled = selectedItems.length === 0;
        }

        function placeOrder() {
            var name = document.getElementById("name").value;
            var phone = document.getElementById("phone").value;
            var address = document.getElementById("address").value;
            
            if (!name || !phone || !address) {
                alert("Please fill all required fields!");
                return;
            }
            
            var total = document.getElementById("totalAmount").innerText;
            var message = "New Order\n\n";
            message += "Name: " + name + "\n";
            message += "Phone: " + phone + "\n";
            message += "Address: " + address + "\n\n";
            message += "Order Details:\n";
            
            selectedItems.forEach(function(item) {
                message += "- " + item.name + " x " + item.qty + " = Rs. " + (item.price * item.qty) + "\n";
            });
            
            message += "\nTotal: Rs. " + total;
            
            var waUrl = "https://wa.me/919203173272?text=" + encodeURIComponent(message);
            window.open(waUrl, "_blank");
        }
    </script>

</body>
</html>
