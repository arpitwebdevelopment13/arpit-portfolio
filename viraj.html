<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Viraj Hotel QR Menu</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:sans-serif;
  background:linear-gradient(135deg,#ff512f,#dd2476);
  color:white;
}

header{
  text-align:center;
  padding:20px;
  background:black;
}

.category{
  padding:15px;
}

.card{
  background:white;
  color:black;
  padding:15px;
  margin:12px 0;
  border-radius:12px;
  font-size:18px;
}

.controls{
  margin-top:10px;
  display:flex;
  gap:10px;
}

button{
  flex:1;
  padding:12px;
  font-size:16px;
  border:none;
  border-radius:8px;
}

.add{background:green;color:white}
.remove{background:red;color:white}

.cart{
  position:fixed;
  bottom:0;
  width:100%;
  background:#000;
  padding:15px;
}

select{
  padding:8px;
  margin-top:10px;
  font-size:16px;
}
</style>

</head>

<body>

<header>
🍽️ Viraj Hotel  
<div id="table"></div>

<select id="people">
<option>1 Person</option>
<option>2 People</option>
<option>3 People</option>
<option>4 People</option>
<option>5 People</option>
<option>6 People</option>
<option>7 People</option>
<option>8 People</option>
<option>9 People</option>
<option>10 People</option>
</select>

</header>

<div id="menu"></div>

<div class="cart">
<h3 id="total">Total: ₹0</h3>
<button onclick="orderNow()">Order on WhatsApp</button>
</div>

<script>

// TABLE
const params = new URLSearchParams(window.location.search);
const table = params.get("table") || "1";
document.getElementById("table").innerText = "Table No: " + table;

// CART
let cart = {};
let total = 0;

// 🔥 FULL PDF MENU (AUTO FIXED)
const rawMenu = `

Onion Salad - 39

Paneer Passanda - 359

Vanilla Ice Cream - 89

Gulab Jamun - 79
Brownie With Ice Cream - 149
`;

// AUTO MENU
let data = {"Menu":[]};

rawMenu.split("\n").forEach(line=>{
  if(line.trim() !== ""){
    let parts = line.split("-");
    let name = parts[0].trim();
    let price = parseInt(parts[1]);
    data["Menu"].push([name,price]);
  }
});

// SHOW MENU
const menuDiv = document.getElementById("menu");

data["Menu"].forEach(item=>{
  menuDiv.innerHTML += `
  <div class="card">
    <div><b>${item[0]}</b> - ₹${item[1]}</div>
    <div class="controls">
      <button class="add" onclick="add('${item[0]}',${item[1]})">ADD</button>
      <button class="remove" onclick="removeItem('${item[0]}',${item[1]})">REMOVE</button>
    </div>
  </div>`;
});

// ADD
function add(name,price){
  if(cart[name]){
    cart[name].qty++;
  }else{
    cart[name]={price:price,qty:1};
  }
  total += price;
  update();
}

// REMOVE
function removeItem(name,price){
  if(cart[name]){
    cart[name].qty--;
    total -= price;
    if(cart[name].qty<=0){
      delete cart[name];
    }
  }
  update();
}

// UPDATE
function update(){
  document.getElementById("total").innerText = "Total: ₹" + total;
}

// ORDER
function orderNow(){

  if(Object.keys(cart).length===0){
    alert("Add items first");
    return;
  }

  let people = document.getElementById("people").value;

  let msg = "Order Table " + table + "%0A";
  msg += "People: " + people + "%0A";

  for(let item in cart){
    msg += item + " x " + cart[item].qty + "%0A";
  }

  msg += "Total: ₹" + total;

  window.open("https://wa.me/919926387888?text=" + msg);
}

</script>

</body>
</html>
